name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  relay-and-cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd relay && npm test
      - run: node --test 'cli/test/*.test.mjs'
      - run: cd gateway && npm ci && npm test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: bash scripts/build-debug.sh
      - uses: actions/upload-artifact@v4
        with:
          name: android-backstage-development-apk
          path: app/app/build/outputs/apk/debug/app-debug.apk
