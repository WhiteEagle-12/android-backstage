# Android Backstage relay behind a Cloudflare Tunnel.
#
#   cp .env.example .env      # paste your tunnel token
#   docker compose up -d
#
# The relay never listens on the public internet; cloudflared dials out to
# Cloudflare and forwards https://relay.android-backstage.com to it.
services:
  relay:
    build:
      context: ../relay
    container_name: backstage-relay
    restart: unless-stopped
    environment:
      PORT: "18421"
      RELAY_DATA_DIR: /data
      RELAY_PUBLIC_URL: ${RELAY_PUBLIC_URL:-https://relay.android-backstage.com}
      RELAY_ADMIN_TOKEN: ${RELAY_ADMIN_TOKEN:-}
      RELAY_MAX_FILE_MB: ${RELAY_MAX_FILE_MB:-512}
      RELAY_ENABLE_LEARN: "0"
    volumes:
      - relay-data:/data
    # Only reachable from the tunnel and from this host. Drop the ports block
    # if you do not want local access at all.
    ports:
      - "127.0.0.1:18421:18421"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: backstage-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - relay

volumes:
  relay-data:
